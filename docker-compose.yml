# Fixed project name: volumes are always seodaily_pgdata and seodaily_uploads.
name: ${COMPOSE_PROJECT_NAME:-seodaily}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seodaily}
      POSTGRES_USER: ${POSTGRES_USER:-seodaily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: seodaily:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-seodaily}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-seodaily}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (at least 32 characters)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      MELIPAYAMAK_USERNAME: ${MELIPAYAMAK_USERNAME:-}
      MELIPAYAMAK_PASSWORD: ${MELIPAYAMAK_PASSWORD:-}
      MELIPAYAMAK_OTP_BODY_ID: ${MELIPAYAMAK_OTP_BODY_ID:-}
      CLAMD_HOST: ${CLAMD_HOST:-clamav}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      PLUGIN_SANDBOX_URL: ${PLUGIN_SANDBOX_URL:-}
      PLUGIN_SANDBOX_TOKEN: ${PLUGIN_SANDBOX_TOKEN:-}
      PLUGINS_AUTO_UPDATE_ENABLED: ${PLUGINS_AUTO_UPDATE_ENABLED:-true}
      PLUGINS_DOWNLOADS_ENABLED: ${PLUGINS_DOWNLOADS_ENABLED:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
      - plugin_files:/app/plugin-files

  # Plugin worker (source checks, package checks, nightly schedule).
  worker:
    image: seodaily:latest
    command: ["worker"]
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-seodaily}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-seodaily}
      APP_INTERNAL_URL: http://app:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      CLAMD_HOST: ${CLAMD_HOST:-clamav}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      PLUGIN_SANDBOX_URL: ${PLUGIN_SANDBOX_URL:-}
      PLUGIN_SANDBOX_TOKEN: ${PLUGIN_SANDBOX_TOKEN:-}
      PLUGINS_AUTO_UPDATE_ENABLED: ${PLUGINS_AUTO_UPDATE_ENABLED:-true}
      PLUGINS_DOWNLOADS_ENABLED: ${PLUGINS_DOWNLOADS_ENABLED:-true}
    volumes:
      - uploads:/app/uploads
      - plugin_files:/app/plugin-files

  # No public port or site volumes. FreshClam updates persistent definitions.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
      CLAMD_CONF_AlertExceedsMax: "yes"
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav_db:/var/lib/clamav
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3

volumes:
  clamav_db:
  pgdata:
  uploads:
  plugin_files:

# Own address range instead of Docker's default pools, which run out on
# machines with many compose projects ("all predefined address pools have
# been fully subnetted"). Change DOCKER_SUBNET in .env if it clashes with
# your LAN or VPN.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.203.77.0/24}
