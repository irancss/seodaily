# /etc/apache2/sites-available/seodaily.ir.conf  (replaces the old WordPress vhost)
# Needs:   a2enmod ssl proxy proxy_http headers
# Enable:  a2ensite seodaily.ir && systemctl reload apache2
#
# Canonical address: https://seodaily.ir (no www). Every other variant answers
# with ONE permanent redirect straight to it, keeping the path and query.
# TLS: the certificate must cover both names, e.g.
#   certbot certonly --webroot -w /var/www/html -d seodaily.ir -d www.seodaily.ir

# --- port 80: both hosts -> https://seodaily.ir
<VirtualHost *:80>
    ServerName seodaily.ir
    ServerAlias www.seodaily.ir
    DocumentRoot /var/www/html
    # Let certificate renewals through, redirect everything else.
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://seodaily.ir/$1
</VirtualHost>

# --- https://www -> https://seodaily.ir
<VirtualHost *:443>
    ServerName www.seodaily.ir
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/seodaily.ir/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/seodaily.ir/privkey.pem
    Redirect permanent / https://seodaily.ir/
</VirtualHost>

# --- canonical site
<VirtualHost *:443>
    ServerName seodaily.ir
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/seodaily.ir/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/seodaily.ir/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 10485760
</VirtualHost>
