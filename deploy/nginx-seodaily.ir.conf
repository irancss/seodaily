# /etc/nginx/sites-available/seodaily.ir  (replaces the old WordPress server block)
# Enable:  ln -s /etc/nginx/sites-available/seodaily.ir /etc/nginx/sites-enabled/
# TLS:     certbot --nginx -d seodaily.ir -d www.seodaily.ir

server {
    listen 80;
    listen [::]:80;
    server_name seodaily.ir www.seodaily.ir;

    client_max_body_size 10m;   # admin image uploads (5 MB limit in the app)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
