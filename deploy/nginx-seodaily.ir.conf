# /etc/nginx/sites-available/seodaily.ir  (replaces the old WordPress server block)
# Enable:  ln -s /etc/nginx/sites-available/seodaily.ir /etc/nginx/sites-enabled/
#
# Canonical address: https://seodaily.ir (no www). Every other variant answers
# with ONE permanent redirect straight to it, keeping the path and query:
#   http://seodaily.ir/x       -> https://seodaily.ir/x
#   http://www.seodaily.ir/x   -> https://seodaily.ir/x
#   https://www.seodaily.ir/x  -> https://seodaily.ir/x
#
# TLS: the certificate must cover both names. First time (before this file is
# active, or with the port-80 block below in place):
#   certbot certonly --webroot -w /var/www/html -d seodaily.ir -d www.seodaily.ir
# Renewals keep working through the /.well-known/acme-challenge/ location.

# --- port 80: both hosts -> https://seodaily.ir -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name seodaily.ir www.seodaily.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://seodaily.ir$request_uri;
    }
}

# --- https://www -> https://seodaily.ir -------------------------------------
server {
    # «listen … http2» works on every nginx version still in use (1.25.1+ also
    # accepts it, with a deprecation note); «http2 on;» needs 1.25.1+.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.seodaily.ir;

    ssl_certificate     /etc/letsencrypt/live/seodaily.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seodaily.ir/privkey.pem;

    return 301 https://seodaily.ir$request_uri;
}

# --- canonical site ------------------------------------------------------------
server {
    # «listen … http2» works on every nginx version still in use (1.25.1+ also
    # accepts it, with a deprecation note); «http2 on;» needs 1.25.1+.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seodaily.ir;

    ssl_certificate     /etc/letsencrypt/live/seodaily.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seodaily.ir/privkey.pem;

    # HSTS is sent by the app itself (next.config.ts).

    client_max_body_size 10m;   # admin image uploads (5 MB limit in the app)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # the app rate-limits by this address
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
