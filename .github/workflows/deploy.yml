name: CI / Deploy

on:
  push:
    branches: [main]
    # Reports and other docs change nothing that is built or deployed.
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same PR makes the older run pointless; deploys on main
  # are never cancelled halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # For the SEO tests: the built app runs against a freshly seeded database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seodaily
          POSTGRES_USER: seodaily
          POSTGRES_PASSWORD: seodaily
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seodaily"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Windows scripts are ASCII-only (Windows PowerShell 5.1 reads them as ANSI)
        run: "! grep -nP '[^\\x00-\\x7F]' scripts/windows/*.ps1"
      - run: npm ci
      - run: npm run lint
      - name: Deploy and ops scripts (POSIX sh, shellcheck)
        run: shellcheck -s sh -S warning deploy/ship.sh deploy/ops/*.sh deploy/sandbox/prepare.sh
      - run: npm run typecheck
      - name: Unit tests (pricing, validation, text rules, plugin pipeline)
        run: npm run test:unit
      - name: Integration tests (slugs, plugin pipeline, downloads) on throwaway databases
        env:
          DATABASE_URL: postgres://seodaily:seodaily@localhost:5432/seodaily
        run: npm run test:integration
      # Next.js reuses compiled output for unchanged files.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Browser for the E2E journeys
        run: npx playwright-core install --with-deps chromium
      - name: SEO, security and E2E tests against the built app
        env:
          DATABASE_URL: postgres://seodaily:seodaily@localhost:5432/seodaily
          SESSION_SECRET: ci-only-session-secret-ci-only-session-secret
          SITE_URL: https://seodaily.ir
          UPLOAD_DIR: /tmp/uploads
          PORT: "3000"
          HOSTNAME: 127.0.0.1
          # Disposable admin of the CI database only.
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-admin-password-123
          # Plugin library, CI only: private fixture source on 127.0.0.1, codes
          # written to a file instead of SMS (refused outside CI in production).
          OTP_HMAC_SECRET: ci-only-otp-secret-ci-only-otp-secret-0000
          INTERNAL_API_SECRET: ci-only-internal-secret-ci-only-internal-0000
          APP_INTERNAL_URL: http://127.0.0.1:3000
          PLUGIN_FILES_DIR: /tmp/plugin-files
          SMS_TEST_OUTBOX: /tmp/sms-outbox.jsonl
          PLUGIN_FETCH_ALLOW_PRIVATE_FOR_TESTS: 127.0.0.1/32
        run: |
          node scripts/migrate.mjs
          node scripts/seed.mjs
          # Same layout as the Docker image: static assets next to the standalone server.
          cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
          node .next/standalone/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
          # The plugin worker, as in production: a separate process.
          node dist/worker.mjs > /tmp/worker.log 2>&1 &
          BASE_URL=http://127.0.0.1:3000 SITE_ORIGIN=https://seodaily.ir npm run test:seo || (tail -50 /tmp/server.log; exit 1)
          BASE_URL=http://127.0.0.1:3000 node tests/seo-report.mjs >> "$GITHUB_STEP_SUMMARY"
          BASE_URL=http://127.0.0.1:3000 npm run test:security || (tail -50 /tmp/server.log; exit 1)
          BASE_URL=http://127.0.0.1:3000 npm run test:e2e || (tail -50 /tmp/server.log; tail -50 /tmp/worker.log; exit 1)
          # Migration/seed safety on throwaway databases next to the CI one.
          npm run test:db

  deploy:
    # Every push to main goes live once the checks pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/seodaily' }}
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::warning::Deploy secrets are not set (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY); skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Image tag
        id: tag
        if: steps.gate.outputs.enabled == 'true'
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      # Layers (base image, npm ci, …) come from the Actions cache when their
      # inputs did not change, so only the app build is redone.
      - name: Build image
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: seodaily:${{ steps.tag.outputs.short }}
          build-args: APP_VERSION=${{ steps.tag.outputs.short }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Set up SSH
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/prod-ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          user: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # Only the changed layers travel, through a registry on the server (deploy/ship.sh).
      - name: Ship the image to the server
        if: steps.gate.outputs.enabled == 'true'
        run: sh deploy/ship.sh "${{ steps.tag.outputs.short }}"

      - name: Stack file and ops scripts
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ssh prod "mkdir -p '$DEPLOY_PATH/ops'"
          scp -q deploy/docker-compose.prod.yml "prod:$DEPLOY_PATH/docker-compose.yml"
          scp -q deploy/ops/*.sh "prod:$DEPLOY_PATH/ops/"

      # Backup, then the new version is started and health-checked next to the
      # running one before it takes over; any failure leaves the old one live.
      - name: Switch to the new version
        if: steps.gate.outputs.enabled == 'true'
        run: ssh prod "DEPLOY_PATH='$DEPLOY_PATH' sh '$DEPLOY_PATH/ops/deploy.sh' '${{ steps.tag.outputs.short }}'"

      - name: Nightly backups and server status
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ssh prod "DEPLOY_PATH='$DEPLOY_PATH' sh '$DEPLOY_PATH/ops/cron.sh'"
          # The first time: one backup and restore drill right away, so there is a baseline.
          ssh prod "DEPLOY_PATH='$DEPLOY_PATH' sh '$DEPLOY_PATH/ops/nightly.sh' --first-time" || echo "::warning::backup or restore check failed (log above)"
          ssh prod "DEPLOY_PATH='$DEPLOY_PATH' sh '$DEPLOY_PATH/ops/status.sh'" | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::server status reports a problem (log above)"

      - name: Blog scheduler heartbeat (read-only)
        if: steps.gate.outputs.enabled == 'true'
        run: ssh prod "DEPLOY_PATH='$DEPLOY_PATH' sh '$DEPLOY_PATH/ops/blog-health.sh'"

  verify:
    # Checks the live site after a deploy, from outside the server.
    needs: deploy
    if: needs.deploy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://seodaily.ir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The deployed commit is live
        run: |
          want=${GITHUB_SHA::12}
          for i in $(seq 1 10); do
            got=$(curl -sS -m 20 "$SITE/api/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            [ "$got" = "$want" ] && { echo "live: $got"; exit 0; }
            sleep 3
          done
          echo "expected $want, production reports '${got:-nothing}'"; exit 1
      - name: TLS certificate is valid for 14+ days
        run: |
          end=$(echo | openssl s_client -connect seodaily.ir:443 -servername seodaily.ir 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ($(date -d "$end" +%s) - $(date +%s)) / 86400 ))
          echo "certificate valid until $end ($days days)"
          [ "$days" -ge 14 ]
      - name: Smoke test production pages
        run: |
          fail=0
          for path in / /robots.txt /sitemap.xml /web-design /seo /services /services/technical-seo /services/seo-audit /pricing /about /contact /blog; do
            body=$(curl -sS -m 30 -w '\n%{http_code} %{time_starttransfer}' "$SITE$path") || { echo "FETCH FAILED $path"; fail=1; continue; }
            code=$(printf '%s' "$body" | tail -n1 | cut -d' ' -f1)
            ttfb=$(printf '%s' "$body" | tail -n1 | cut -d' ' -f2)
            html=$(printf '%s' "$body" | sed '$d')
            title=$(printf '%s' "$html" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
            canonical=$(printf '%s' "$html" | grep -o '<link rel="canonical" href="[^"]*"' | head -1 | sed 's/.*href="//;s/"$//')
            h1=$(printf '%s' "$html" | grep -o '<h1[ >]' | wc -l)
            robots=$(printf '%s' "$html" | grep -o '<meta name="robots" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"$//')
            echo "$code $path | ttfb=${ttfb}s | h1=$h1 | canonical=$canonical | robots=${robots:-index} | $title"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
      - name: Domain variants redirect to the canonical host in one hop (campaign parameters kept)
        run: |
          fail=0
          for pair in "http://seodaily.ir/|$SITE/" "http://www.seodaily.ir/|$SITE/" "https://www.seodaily.ir/|$SITE/" \
                      "http://seodaily.ir/seo|$SITE/seo" "http://www.seodaily.ir/seo|$SITE/seo" "https://www.seodaily.ir/seo|$SITE/seo" \
                      "https://www.seodaily.ir/seo?utm_source=ci&utm_medium=verify|$SITE/seo?utm_source=ci&utm_medium=verify" \
                      "http://seodaily.ir/?gclid=ci|$SITE/?gclid=ci"; do
            from=${pair%%|*}; to=${pair#*|}
            out=$(curl -sS -o /dev/null -m 30 -w '%{http_code} %{redirect_url}' "$from") || { echo "UNREACHABLE $from"; fail=1; continue; }
            final=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${out#* }") || final=000
            echo "$from -> $out -> $final"
            [ "$out" = "301 $to" ] && [ "$final" = 200 ] || fail=1
          done
          [ "$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "$SITE/seo")" = 200 ] || fail=1
          exit $fail
      - name: Plugin library (read-only; no login, no SMS, no downloads)
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' -m 20 "$@"; }
          [ "$(code "$SITE/plugins")" = 200 ] || { echo "/plugins is not 200"; exit 1; }
          [ "$(code "$SITE/plugins/no-such-plugin-$GITHUB_RUN_ID")" = 404 ] || { echo "unknown plugin is not 404"; exit 1; }
          [ "$(code -X POST "$SITE/api/internal/revalidate")" = 404 ] || { echo "internal endpoint answers without its secret"; exit 1; }
          [ "$(code "$SITE/plugins/x/download/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa")" = 403 ] || { echo "file route answers without a session"; exit 1; }
          echo "plugin library routes behave as expected"
      - name: Blog publication boundaries (read-only)
        run: |
          [ "$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$SITE/blog/no-such-article-$GITHUB_RUN_ID")" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$SITE/blog?page=invalid")" = 404 ]
      - name: SEO crawl report (job summary)
        run: BASE_URL="$SITE" node tests/seo-report.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: SEO tests against production
        run: BASE_URL="$SITE" SITE_ORIGIN="$SITE" npm run test:seo
      - name: Security checks against production (read-only; no login, no form posts)
        run: BASE_URL="$SITE" npm run test:security
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Browser for the layout checks
        run: npm ci --no-audit --no-fund && npx playwright-core install --with-deps chromium
      - name: Responsive layout on production (8 widths, read-only)
        run: BASE_URL="$SITE" node --test --test-concurrency=1 tests/e2e/layout.test.mjs
      - name: Accessibility on production (axe WCAG 2.2 AA + keyboard, read-only)
        run: BASE_URL="$SITE" node --test --test-concurrency=1 tests/e2e/a11y.test.mjs
      - name: Analytics events on production (clicks only, read-only)
        run: BASE_URL="$SITE" node --test --test-concurrency=1 tests/e2e/analytics.test.mjs
