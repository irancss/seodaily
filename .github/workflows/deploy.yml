name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # For the SEO tests: the built app runs against a freshly seeded database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seodaily
          POSTGRES_USER: seodaily
          POSTGRES_PASSWORD: seodaily
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seodaily"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Windows scripts are ASCII-only (Windows PowerShell 5.1 reads them as ANSI)
        run: "! grep -nP '[^\\x00-\\x7F]' scripts/windows/*.ps1"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: SEO tests (robots, sitemap, canonical, 404, metadata, admin noindex)
        env:
          DATABASE_URL: postgres://seodaily:seodaily@localhost:5432/seodaily
          SESSION_SECRET: ci-only-session-secret-ci-only-session-secret
          SITE_URL: https://seodaily.ir
          UPLOAD_DIR: /tmp/uploads
          PORT: "3000"
          HOSTNAME: 127.0.0.1
        run: |
          node scripts/migrate.mjs
          node scripts/seed.mjs
          node .next/standalone/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:3000 SITE_ORIGIN=https://seodaily.ir npm run test:seo || (tail -50 /tmp/server.log; exit 1)
          BASE_URL=http://127.0.0.1:3000 node tests/seo-report.mjs >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Every push to main goes live once the checks pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/seodaily' }}
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::warning::Deploy secrets are not set (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY); skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Build image
        if: steps.gate.outputs.enabled == 'true'
        run: docker build -t "seodaily:${GITHUB_SHA::12}" -t seodaily:latest .

      - name: Set up SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CFG
          Host prod
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
          CFG

      - name: Ship images to the server
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ssh prod "mkdir -p '$DEPLOY_PATH'"
          docker save "seodaily:${GITHUB_SHA::12}" seodaily:latest | gzip | ssh prod 'gunzip | docker load'
          # The database image is sent once; the server may not reach Docker Hub.
          if ! ssh prod 'docker image inspect postgres:16-alpine >/dev/null 2>&1'; then
            docker pull postgres:16-alpine
            docker save postgres:16-alpine | gzip | ssh prod 'gunzip | docker load'
          fi
          scp deploy/docker-compose.prod.yml "prod:$DEPLOY_PATH/docker-compose.yml"

      - name: Start the new version
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ssh prod "DEPLOY_PATH='$DEPLOY_PATH' sh -s" <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"
          test -f .env || { echo "Missing $DEPLOY_PATH/.env on the server"; exit 1; }
          docker compose up -d --remove-orphans
          for i in $(seq 1 30); do
            if docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "healthy"; break
            fi
            [ "$i" = 30 ] && { docker compose logs --tail 80 app; exit 1; }
            sleep 3
          done
          # Migrations and the service-content upgrade run when the container starts.
          docker compose logs app 2>&1 | grep -E "migrations|service content|seeded|admin user" | tail -5 || true
          # Keep the five most recent versions for rollback.
          docker images seodaily --format '{{.Tag}} {{.CreatedAt}}' | grep -v '^latest ' | sort -k2 -r | tail -n +6 | awk '{print "seodaily:"$1}' | xargs -r docker rmi >/dev/null 2>&1 || true
          docker image prune -f >/dev/null
          REMOTE

  verify:
    # Checks the live site after a deploy, from outside the server.
    needs: deploy
    if: needs.deploy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      SITE: https://seodaily.ir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test production pages
        run: |
          fail=0
          for path in / /robots.txt /sitemap.xml /web-design /seo /services /services/technical-seo /services/seo-audit /pricing /about /contact; do
            body=$(curl -sS -m 30 -w '\n%{http_code}' "$SITE$path") || { echo "FETCH FAILED $path"; fail=1; continue; }
            code=$(printf '%s' "$body" | tail -n1)
            html=$(printf '%s' "$body" | sed '$d')
            title=$(printf '%s' "$html" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
            canonical=$(printf '%s' "$html" | grep -o '<link rel="canonical" href="[^"]*"' | head -1 | sed 's/.*href="//;s/"$//')
            h1=$(printf '%s' "$html" | grep -o '<h1[ >]' | wc -l)
            robots=$(printf '%s' "$html" | grep -o '<meta name="robots" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"$//')
            echo "$code $path | h1=$h1 | canonical=$canonical | robots=${robots:-index} | $title"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
      - name: Domain variants redirect to the canonical host in one hop
        run: |
          fail=0
          for pair in "http://seodaily.ir/|$SITE/" "http://www.seodaily.ir/|$SITE/" "https://www.seodaily.ir/|$SITE/" \
                      "http://seodaily.ir/seo|$SITE/seo" "http://www.seodaily.ir/seo|$SITE/seo" "https://www.seodaily.ir/seo|$SITE/seo"; do
            from=${pair%%|*}; to=${pair#*|}
            out=$(curl -sS -o /dev/null -m 30 -w '%{http_code} %{redirect_url}' "$from") || { echo "UNREACHABLE $from"; fail=1; continue; }
            final=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${out#* }") || final=000
            echo "$from -> $out -> $final"
            [ "$out" = "301 $to" ] && [ "$final" = 200 ] || fail=1
          done
          [ "$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "$SITE/seo")" = 200 ] || fail=1
          exit $fail
      - name: SEO crawl report (job summary)
        run: BASE_URL="$SITE" node tests/seo-report.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: SEO tests against production
        run: BASE_URL="$SITE" SITE_ORIGIN="$SITE" npm run test:seo

