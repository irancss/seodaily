name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deploy:
    # Every push to main goes live once the checks pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/seodaily' }}
    steps:
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::warning::Deploy secrets are not set (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY); skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Build image
        if: steps.gate.outputs.enabled == 'true'
        run: docker build -t "seodaily:${GITHUB_SHA::12}" -t seodaily:latest .

      - name: Set up SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CFG
          Host prod
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
          CFG

      - name: Ship images to the server
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ssh prod "mkdir -p '$DEPLOY_PATH'"
          docker save "seodaily:${GITHUB_SHA::12}" seodaily:latest | gzip | ssh prod 'gunzip | docker load'
          # The database image is sent once; the server may not reach Docker Hub.
          if ! ssh prod 'docker image inspect postgres:16-alpine >/dev/null 2>&1'; then
            docker pull postgres:16-alpine
            docker save postgres:16-alpine | gzip | ssh prod 'gunzip | docker load'
          fi
          scp deploy/docker-compose.prod.yml "prod:$DEPLOY_PATH/docker-compose.yml"

      - name: Start the new version
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ssh prod "DEPLOY_PATH='$DEPLOY_PATH' sh -s" <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"
          test -f .env || { echo "Missing $DEPLOY_PATH/.env on the server"; exit 1; }
          docker compose up -d --remove-orphans
          for i in $(seq 1 30); do
            if docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "healthy"; break
            fi
            [ "$i" = 30 ] && { docker compose logs --tail 80 app; exit 1; }
            sleep 3
          done
          # Keep the five most recent versions for rollback.
          docker images seodaily --format '{{.Tag}} {{.CreatedAt}}' | grep -v '^latest ' | sort -k2 -r | tail -n +6 | awk '{print "seodaily:"$1}' | xargs -r docker rmi >/dev/null 2>&1 || true
          docker image prune -f >/dev/null
          REMOTE
